[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "buildsignal-ai"
version = "0.1.0"
description = "Evidence-first discovery of useful open-source AI project opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hanish Keloth"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9", "build>=1.2"]

[project.scripts]
buildsignal = "buildsignal.cli:main"

[project.urls]
Homepage = "https://github.com/hanishkeloth/buildsignal-ai"
Issues = "https://github.com/hanishkeloth/buildsignal-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildsignal = ["*.json", "*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
